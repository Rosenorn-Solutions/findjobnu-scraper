[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobindex-scraper"
version = "0.1.0"
description = "Greenfield Jobindex scraper implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "pyodbc>=5.1",
    "requests>=2.31",
]

[project.scripts]
jobindex-scraper = "jobindex_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
